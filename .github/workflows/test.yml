name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-asyncio homeassistant==2025.1.4
      - run: python -m pip install --no-deps pytest-homeassistant-custom-component==0.13.205
      - run: python -m pip install freezegun pytest-socket pytest-timeout pytest-unordered requests-mock
      - run: python -m compileall -q custom_components tests
      - run: python -m pytest -q
